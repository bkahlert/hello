name: build

on:
  push:
    branches: [museum]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-push:
    name: Build & push multi-arch museum image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 11 (Liberica)
        uses: actions/setup-java@v4
        with:
          distribution: liberica
          # Pin to 11.0.19 — newer 11.x point releases break Gradle 8.2.1
          # (see CLAUDE.md "Build prerequisites").
          java-version: '11.0.19'

      - uses: gradle/actions/setup-gradle@v3

      - name: Build Kotlin/JS distributions
        # --no-parallel: composite-build + parallel kotlinNpmInstall corrupts
        # ~/.cache/yarn/v6 (zero-byte tarballs, sha1 mismatches). Local builds
        # are fine because the cache is warm; CI hits a cold cache and races.
        run: ./gradlew :web-app:jsBrowserDistribution :playground-app:jsBrowserDistribution --no-parallel

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: bkahlert/hello
          tags: |
            type=raw,value=museum
            type=raw,value=museum-{{sha}}

      - name: Build (amd64 only) for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64
          load: true
          tags: hello:museum-smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test
        run: ./smoke hello:museum-smoke

      - name: Build & push multi-arch
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
